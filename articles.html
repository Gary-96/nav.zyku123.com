<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 资讯速递 | 优创导航 - 发现全球优质 AI 资源</title>
    <meta name="description" content="精选AI技术、大模型、应用开发等前沿资讯，及时掌握全球 AI 行业动态。">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/favicon.webp" type="image/webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 1. 顶部固定导航 -->
    <header class="fixed-header">
        <div class="header-left">
            <div class="logo-wrapper">
                <a href="./index.html" class="logo">
                    <img src="assets/images/logo@2x.webp" alt="Logo">
                </a>
            </div>
            <nav class="top-nav-links">
                <a href="./articles.html" class="nav-item">
                    <i class="fas fa-robot"></i><span>AI资讯</span>
                </a>
                <a href="./hot.html" class="nav-item">
                    <i class="fas fa-fire"></i><span>实时热点</span>
                </a>
            </nav>
        </div>
        <div class="header-right">
            <!-- 天气信息 -->
            <div class="weather-info" id="weather-widget">
                <span class="weather-city">襄阳</span>
                <span class="weather-icon">☁️</span>
                <span class="weather-temp">--°</span>
            </div>
            <div class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </div>
            <div id="theme-toggle" class="theme-switch" title="切换主题">
                <i class="fas fa-moon"></i>
            </div>
            <div class="top-tool-link wechat-nav-item">
                <i class="fab fa-weixin" style="color: #07C160;"></i><span>公众号</span>
                <div class="nav-qr-popup">
                    <img src="assets/images/gzh-qrcode.webp" alt="扫码关注公众号">
                    <p>扫码获取最新 AI 资源</p>
                </div>
            </div>
            <a href="./disclaimer.html" class="top-tool-link">
                <i class="fas fa-info-circle"></i><span>关于</span>
            </a>
        </div>
    </header>

    <!-- 2. 文章内容区域 (Refactor 2026) -->
    <div class="app-container">
        <div class="main-wrapper">
            <main class="main-content">
                <div class="news-section">
                    <!-- 顶层头部 -->
                    <div class="news-header">
                        <div class="title-group">
                            <h1>AI 资讯速递</h1>
                            <p>掌握全球 AI 行业动态 | 实时更新共 <span id="newsCount">0</span> 篇</p>
                        </div>
                        <button class="news-refresh-btn" onclick="fetchNews()">
                            <i class="fas fa-sync-alt"></i>
                            刷新资讯
                        </button>
                    </div>

                    <!-- 分类标签 -->
                    <div class="news-tags">
                        <div class="news-tag active">全部资讯</div>
                        <div class="news-tag">大语言模型</div>
                        <div class="news-tag">应用案例</div>
                        <div class="news-tag">前沿研究</div>
                        <div class="news-tag">产业观察</div>
                    </div>

                    <!-- 网格容器 (ID 已按要求设置为 news-grid) -->
                    <div class="news-grid-container" id="news-grid">
                        <!-- 骨架屏或内容将在此生成 -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- JavaScript 逻辑集成 -->
    <script src="weather.js"></script>
    <script src="mobile-menu.js"></script>
    <script>
        /**
         * 兜底数据 (Fallback Data)
         * 确保请求失败或超时时页面不空白
         */
        const FALLBACK_NEWS = [
            { title: "OpenAI 发布 o1 模型：强化学习推理能力大幅提升", url: "https://36kr.com" },
            { title: "DeepSeek-V3 开启全网公测：国产大模型性能比肩 GPT-4", url: "https://juejin.cn" },
            { title: "Midjourney v7 即将到来：支持更高分辨率与精准提示词", url: "https://www.ithome.com" },
            { title: "Kimi 智能助手长文本能力升级，支持 1000 万字上下文输入", url: "https://36kr.com" },
            { title: "Google Gemini 1.5 Pro 性能实测：在编码与推理领域表现强劲", url: "https://sspai.com" },
            { title: "字节跳动豆包大模型商业化加速，日均 tokens 调用量破千亿", url: "https://36kr.com" }
        ];

        /**
         * 获取并渲染新闻内容
         */
        async function fetchNews() {
            const grid = document.getElementById('news-grid');
            const countEl = document.getElementById('newsCount');
            const refreshIcon = document.querySelector('.news-refresh-btn i');

            // 1. 初始化并生成 6 个骨架屏卡片
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="news-card skeleton">
                    <div class="s-title skeleton-shimmer"></div>
                    <div class="s-title-2 skeleton-shimmer"></div>
                    <div class="s-meta skeleton-shimmer"></div>
                </div>
            `).join('');
            
            if(refreshIcon) refreshIcon.classList.add('fa-spin');

            // 2. 准备 Fetch (带 3 秒超时限制)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const response = await fetch('https://api.vvhan.com/api/hotlist/36ke', { signal: controller.signal });
                clearTimeout(timeoutId);
                const json = await response.json();

                if (json.success && json.data) {
                    const data = json.data.slice(0, 6);
                    renderNewsItems(data);
                    countEl.innerText = data.length;
                } else {
                    throw new Error('API Response Error');
                }
            } catch (error) {
                console.warn('Fetch News Failed / Timeout:', error);
                // 3. 执行兜底策略
                renderNewsItems(FALLBACK_NEWS);
                countEl.innerText = FALLBACK_NEWS.length;
            } finally {
                if(refreshIcon) refreshIcon.classList.remove('fa-spin');
            }
        }

        /**
         * 真正的渲染函数
         */
        function renderNewsItems(data) {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = data.map(item => `
                <a href="${item.url}" target="_blank" class="news-card">
                    <h3>${item.title}</h3>
                    <div class="news-info">
                        <span class="source">36氪 · AI热门</span>
                        <span class="date">${new Date().toLocaleDateString('zh-CN')}</span>
                    </div>
                </a>
            `).join('');
        }

        // 初始化加载
        document.addEventListener('DOMContentLoaded', () => {
            fetchNews();

            // 返回顶部逻辑
            const btt = document.getElementById('backToTop');
            if (btt) {
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 400) btt.classList.add('show');
                    else btt.classList.remove('show');
                });
                btt.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }
        });
    </script>

    <style>
        /* 文章页面核心容器优化 */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 100px 20px 60px; /* 顶部留出导航高度 */
        }
        
        .main-wrapper {
            display: block;
        }
        
        .main-content {
            width: 100%;
        }

        /* 标签栏美化 */
        .news-tags {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* 骨架屏补丁 */
        .skeleton { position: relative; }
    </style>

</body>
</html>
