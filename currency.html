<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>实时汇率转换器 | 优创导航 - 发现全球优质 AI 资源</title>
    <link rel="icon" href="./assets/images/favicon.webp" type="image/webp">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
        }

        /* 主容器解除限制 */
        .currency-container {
            width: 100% !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
            padding: 100px 20px 40px !important; /* 留出顶部导航栏 */
        }

        .converter-header { text-align: center; color: #fff; margin-bottom: 40px; }
        .converter-header h1 { font-size: 48px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .converter-header p { font-size: 18px; opacity: 0.9; }

        /* --- 强制响应式网格 --- */
        .currency-grid {
            display: grid !important;
            gap: 24px !important;
            margin-top: 30px !important;
            width: 100% !important;
            grid-template-columns: 1fr !important; /* 手机端 1列 */
        }

        @media (min-width: 768px) {
            .currency-grid { grid-template-columns: repeat(2, 1fr) !important; } /* 平板 2列 */
        }

        @media (min-width: 1024px) {
            .currency-grid { grid-template-columns: repeat(3, 1fr) !important; } /* 电脑 3列 */
        }

        /* --- 卡片及内部元素 --- */
        .currency-card {
            background: rgba(255, 255, 255, 0.95) !important;
            border-radius: 15px !important; padding: 25px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important; transition: all 0.3s !important;
        }
        .currency-card:hover { transform: translateY(-5px) !important; box-shadow: 0 15px 40px rgba(0,0,0,0.3) !important; }
        
        .currency-header { display: flex !important; align-items: center !important; gap: 12px !important; margin-bottom: 15px !important; }
        .currency-flag { width: 32px !important; height: 32px !important; border-radius: 50% !important; object-fit: cover !important; }
        .currency-name { font-size: 16px !important; font-weight: 600 !important; color: #333 !important; white-space: nowrap !important; }
        
        /* 实时汇率微标 */
        .currency-rate {
            font-size: 13px !important; font-weight: 500 !important; padding: 4px 8px !important;
            border-radius: 6px !important; background: rgba(16, 185, 129, 0.1) !important; color: #10b981 !important;
            white-space: nowrap !important; transition: all 0.3s !important;
        }

        .currency-code {
            font-size: 14px !important; color: #666 !important; margin-left: auto !important;
            background: #f0f0f0 !important; padding: 4px 12px !important; border-radius: 12px !important; font-weight: 500 !important;
        }

        .currency-input {
            width: 100% !important; padding: 15px !important; border: 2px solid #e0e0e0 !important;
            border-radius: 10px !important; font-size: 24px !important; font-weight: 600 !important;
            color: #333 !important; transition: all 0.3s !important; font-family: inherit !important;
        }
        .currency-input:focus { outline: none !important; border-color: #667eea !important; box-shadow: 0 0 0 3px rgba(102,126,234,0.1) !important; }

        /* --- 其他信息 --- */
        .update-info { text-align: center; color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 30px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .base-currency-selector { text-align: center; margin-bottom: 30px; }
        .base-currency-selector label { color: #fff; font-size: 16px; margin-right: 15px; font-weight: 600; }
        .base-currency-selector select { padding: 10px 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.2); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
        .base-currency-selector select option { background: #2a5298; color: #fff; }
    </style>
</head>
<body>
    <header class="fixed-header">
        <div class="header-left">
            <div class="logo-wrapper">
                <a href="./index.html" class="logo">
                    <img src="assets/images/logo@2x.webp" alt="Logo">
                </a>
            </div>
            <nav class="top-nav-links">
                <a href="./articles.html" class="nav-item">
                    <i class="fas fa-robot"></i><span>AI资讯</span>
                </a>
                <a href="./hot.html" class="nav-item">
                    <i class="fas fa-fire"></i><span>实时热点</span>
                </a>
            </nav>
        </div>
        <div class="header-right">
            <div class="weather-info" id="weather-widget">
                <span class="weather-city">襄阳</span>
                <span class="weather-icon">☁️</span>
                <span class="weather-temp">--°</span>
            </div>
            <div class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </div>
            <div id="theme-toggle" class="theme-switch" title="切换主题">
                <i class="fas fa-moon"></i>
            </div>
            <div class="top-tool-link wechat-nav-item">
                <i class="fab fa-weixin" style="color: #07C160;"></i><span>公众号</span>
                <div class="nav-qr-popup">
                    <img src="assets/images/gzh-qrcode.webp" alt="扫码关注公众号">
                    <p>扫码获取最新 AI 资源</p>
                </div>
            </div>
            <a href="./disclaimer.html" class="top-tool-link">
                <i class="fas fa-info-circle"></i><span>关于</span>
            </a>
        </div>
    </header>

    <div class="currency-container">
        <div class="converter-header">
            <h1>全球货币实时转换</h1>
            <p>支持多种主流货币，汇率实时更新，输入任意金额自动联动换算</p>
        </div>

        <div class="base-currency-selector">
            <label>基准货币：</label>
            <select id="base-currency">
                <option value="CNY" selected>CNY - 人民币</option>
                <option value="VND">VND - 越南盾</option>
                <option value="USD">USD - 美元</option>
                <option value="EUR">EUR - 欧元</option>
                <option value="JPY">JPY - 日元</option>
                <option value="GBP">GBP - 英镑</option>
                <option value="HKD">HKD - 港币</option>
                <option value="THB">THB - 泰铢</option>
                <option value="MYR">MYR - 马来西亚林吉特</option>
            </select>
        </div>

        <div class="currency-grid" id="currency-grid">
            </div>

        <div class="update-info" id="update-info">
            汇率更新时间：加载中...
        </div>
    </div>

    <script>
    const currencies = {
        'CNY': { name: '人民币', flag: 'cn' },
        'VND': { name: '越南盾', flag: 'vn' },
        'USD': { name: '美元', flag: 'us' },
        'EUR': { name: '欧元', flag: 'eu' },
        'JPY': { name: '日元', flag: 'jp' },
        'GBP': { name: '英镑', flag: 'gb' },
        'HKD': { name: '港币', flag: 'hk' },
        'THB': { name: '泰铢', flag: 'th' },
        'MYR': { name: '马来西亚林吉特', flag: 'my' }
    };

    let exchangeRates = {};
    let baseCurrency = 'CNY';
    let isUpdating = false;

    // 获取汇率
    async function fetchExchangeRates(base) {
        try {
            const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${base}`);
            const data = await response.json();
            exchangeRates = data.rates;
            
            const updateDate = new Date(data.time_last_updated * 1000);
            document.getElementById('update-info').textContent = 
                `汇率更新时间：${updateDate.toLocaleString('zh-CN')} | 基准货币：${base}`;
            
            return data.rates;
        } catch (error) {
            console.error('获取汇率失败:', error);
            document.getElementById('update-info').textContent = '汇率获取失败，请稍后重试';
            return null;
        }
    }

    // 创建货币卡片，植入“实时汇率微标”
    function createCurrencyCards() {
        const grid = document.getElementById('currency-grid');
        grid.innerHTML = '';

        Object.keys(currencies).forEach(code => {
            const card = document.createElement('div');
            card.className = 'currency-card';
            
            // 核心修改：增加 id="rate-${code}" 标签
            card.innerHTML = `
                <div class="currency-header">
                    <img src="https://flagcdn.com/w40/${currencies[code].flag}.webp" 
                         alt="${code}" 
                         class="currency-flag">
                    <span class="currency-name">${currencies[code].name}</span>
                    <span class="currency-rate" id="rate-${code}">加载中...</span>
                    <span class="currency-code">${code}</span>
                </div>
                <input type="number" 
                       class="currency-input" 
                       id="input-${code}" 
                       placeholder="0.00"
                       step="0.01">
            `;
            grid.appendChild(card);

            // 添加输入事件监听
            const input = card.querySelector('.currency-input');
            input.addEventListener('input', function() {
                if (!isUpdating) {
                    updateAllCurrencies(code, parseFloat(this.value) || 0);
                }
            });
        });
    }

    // 更新页面上的“实时汇率微标”数值
    function updateRateDisplays() {
        Object.keys(currencies).forEach(code => {
            const rateEl = document.getElementById(`rate-${code}`);
            if (rateEl && exchangeRates[code]) {
                if (code === baseCurrency) {
                    // 如果是基准货币本身，显示“基准”且变灰
                    rateEl.textContent = '当前基准';
                    rateEl.style.color = '#888';
                    rateEl.style.background = '#f5f5f5';
                } else {
                    // 显示例如 1 CNY = xxx VND
                    let rateVal = exchangeRates[code];
                    let displayVal = rateVal < 0.01 ? rateVal.toFixed(6) : rateVal.toFixed(4);
                    rateEl.textContent = `1 ${baseCurrency} = ${displayVal} ${code}`;
                    rateEl.style.color = '#10b981';
                    rateEl.style.background = 'rgba(16, 185, 129, 0.1)';
                }
            }
        });
    }

    // 联动计算所有货币的输入框
    function updateAllCurrencies(sourceCode, sourceAmount) {
        isUpdating = true;

        Object.keys(currencies).forEach(targetCode => {
            if (targetCode !== sourceCode) {
                const input = document.getElementById(`input-${targetCode}`);
                if (input) {
                    const rate = exchangeRates[targetCode] / exchangeRates[sourceCode];
                    const result = sourceAmount * rate;
                    // 空值处理
                    if (sourceAmount === 0 || isNaN(sourceAmount)) {
                        input.value = '';
                    } else {
                        input.value = result.toFixed(2);
                    }
                }
            }
        });

        isUpdating = false;
    }

    // 切换基准货币
    document.getElementById('base-currency').addEventListener('change', async function() {
        baseCurrency = this.value;
        await fetchExchangeRates(baseCurrency);
        updateRateDisplays(); // 更新微标
        
        const firstInput = document.getElementById(`input-${baseCurrency}`);
        if (firstInput && firstInput.value) {
            updateAllCurrencies(baseCurrency, parseFloat(firstInput.value) || 0);
        }
    });

    // 初始化加载
    (async function() {
        createCurrencyCards();
        await fetchExchangeRates(baseCurrency);
        updateRateDisplays(); 
    })();
    </script>
    <script src="js/weather.js" defer></script>
    <script src="js/mobile-menu.js" defer></script>
    <script src="js/theme-toggle.js" defer></script>
</body>
</html>
